<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Whisper of Motion</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Page not found — Whisper of Motion by Lina Nguen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=DM+Sans:wght@400&display=swap">
  <link rel="stylesheet" href="styles/variables.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(80px, 20vw, 200px);
      font-weight: 300;
      line-height: 1;
      color: var(--color-accent-muted, #E8E0DC);
      margin-bottom: 1rem;
    }
    .error-message {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 20px;
      color: var(--color-text-secondary, #6B6368);
      margin-bottom: 2rem;
      max-width: 400px;
    }
    .error-link {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text, #2E2E32);
      text-decoration: none;
      border: 1px solid var(--color-accent, #CFA6A8);
      padding: 12px 28px;
      border-radius: var(--radius-sm, 4px);
      transition: background 200ms ease, color 200ms ease;
    }
    .error-link:hover {
      background: var(--color-accent, #CFA6A8);
      color: white;
    }
  </style>
</head>
<body>
  <p class="error-code">404</p>
  <p class="error-message">The page you're looking for has left the stage.</p>
  <a href="index.html" class="error-link">Return to Home</a>
</body>
</html>
